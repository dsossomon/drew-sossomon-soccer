<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drew Sossomon | Photo Vault</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #060B18; /* Elite Matte Dark Base */
            padding: 50px 24px;
            font-family: 'Montserrat', sans-serif;
        }

        /* HEADER INTERFACE ZONE */
        .gallery-control-header {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: flex-start;
        }

        /* PREMIUM DYNAMIC RETURNING BUTTON */
        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-weight: 900;
            font-size: 0.85rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            color: #00B4D8; /* Your Signature Energy Blue */
            background-color: transparent;
            border: 2px solid #00B4D8;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .home-btn:hover {
            color: #060B18;
            background-color: #00B4D8;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.5);
        }

        /* PURE ATHLETIC MASONRY MATRIX */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-grid img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            border: 1px solid rgba(0, 180, 216, 0.15);
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        /* Micro-interaction expansion response */
        .gallery-grid img:hover {
            transform: scale(1.02);
            border-color: #00B4D8;
            box-shadow: 0 0 25px rgba(0, 180, 216, 0.25);
        }

        @media (max-width: 768px) {
            body { padding: 30px 16px; }
            .gallery-grid { grid-template-columns: 1fr; gap: 16px; }
            .home-btn { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <!-- CONTROL WRAPPER -->
    <header class="gallery-control-header">
        <a href="index.html" class="home-btn">← Back to Home</a>
    </header>

    <!-- CONTENT MASONRY -->
    <main class="gallery-grid">
        <img src="20250110_115306.jpg" alt="Drew Sossomon Media Asset">
        <img src="20250110_115332.jpg" alt="Drew Sossomon Media Asset">
        <img src="image000001.jpg" alt="Drew Sossomon Media Asset">
        <img src="image000002001.jpg" alt="Drew Sossomon Media Asset">
    </main>

</body>
</html>
